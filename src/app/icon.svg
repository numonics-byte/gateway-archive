<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Dark background -->
  <rect width="32" height="32" rx="4" fill="#0a0a0f"/>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="9" fill="none" stroke="#ff3366" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Spikes cardinal -->
  <line x1="16" y1="5"  x2="16" y2="2"  stroke="#ff3366" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="27" x2="16" y2="30" stroke="#ff3366" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="5"  y1="16" x2="2"  y2="16" stroke="#ff3366" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="27" y1="16" x2="30" y2="16" stroke="#ff3366" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Spikes diagonal -->
  <line x1="9"  y1="9"  x2="7"  y2="7"  stroke="#ff3366" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23" y1="9"  x2="25" y2="7"  stroke="#ff3366" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="9"  y1="23" x2="7"  y2="25" stroke="#ff3366" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23" y1="23" x2="25" y2="25" stroke="#ff3366" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Core -->
  <circle cx="16" cy="16" r="3" fill="#ff3366" filter="url(#glow)"/>
</svg>
